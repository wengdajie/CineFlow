# 构建多架构镜像并推送到 GitHub Container Registry (GHCR)
# 目的：让 NAS 上 docker compose 能直接 pull 现成镜像，无需在 NAS 上编译
# （NAS 性能弱，本地 build 要 5~10 分钟且常因网络失败）
name: build-image

# 加引号：YAML 1.1 把裸 on 当布尔，键名会变成 True，yq/actionlint 读不到
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: python -m pip install --quiet -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check app plugins tests scripts/project_facts.py
      - name: Frontend modules
        run: node scripts/check_frontend.mjs
      - name: Tests
        run: python -m pytest --disable-warnings
      - name: Documentation facts
        run: python scripts/project_facts.py --check
  build:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 GHCR 必需
    steps:
      - uses: actions/checkout@v4

      # QEMU 用于交叉编译 arm64（很多 NAS 是 ARM 架构）
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 自动注入，无需手工配置

      # 镜像名必须全小写，否则 GHCR 拒绝
      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cineflow
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
