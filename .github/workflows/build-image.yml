# 构建多架构镜像并推送到 GitHub Container Registry (GHCR)
# 目的：让 NAS 上 docker compose 能直接 pull 现成镜像，无需在 NAS 上编译
# （NAS 性能弱，本地 build 要 5~10 分钟且常因网络失败）
name: build-image

# 加引号：YAML 1.1 把裸 on 当布尔，键名会变成 True，yq/actionlint 读不到
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: python -m pip install --quiet -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check app plugins tests scripts/project_facts.py scripts/container_smoke.py
      - name: Frontend modules
        run: node scripts/check_frontend.mjs
      - name: Tests
        run: python -m pytest --disable-warnings
      - name: Documentation facts
        run: |
          set -euo pipefail
          python scripts/project_facts.py --check
          temporary=$(mktemp -d)
          export CF_DATA_DIR="$temporary/data" CF_DOWNLOAD_DIR="$temporary/downloads"
          export CF_LIBRARY_DIR="$temporary/library" CF_STRM_DIR="$temporary/strm"
          export CF_PLUGIN_DIR="$temporary/plugins" CF_CONFIG_FILE="$temporary/missing.yaml"
          export CF_DB_URL="sqlite:///$temporary/app.db" CF_SCHEDULER_ENABLED=false
          export CF_HOST=127.0.0.1 CF_PORT=16060 CF_DEBUG=false
          export CF_SMOKE_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$CF_SMOKE_PASSWORD"
          export CF_SUPERUSER=smoke_admin CF_SUPERUSER_PASSWORD="$CF_SMOKE_PASSWORD"
          export CF_SMOKE_URL=http://127.0.0.1:16060 CF_BASE_URL=http://127.0.0.1:16060
          export CF_SMOKE_VERSION=$(python -c "import runpy; print(runpy.run_path('app/core/version.py')['APP_VERSION'])")
          python -m app.main > "$temporary/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python scripts/container_smoke.py
          python scripts/verify_docs.py
          python scripts/verify_yaml.py
  build:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write        # 推 GHCR 必需
    steps:
      - uses: actions/checkout@v4

      # QEMU 用于交叉编译 arm64（很多 NAS 是 ARM 架构）
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 构建待验证镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cineflow:smoke
          cache-from: type=gha

      - name: 容器启动、登录与持久化验证
        env:
          CF_SMOKE_USERNAME: smoke_admin
        run: |
          set -euo pipefail
          export CF_SMOKE_VERSION=$(python -c "import runpy; print(runpy.run_path('app/core/version.py')['APP_VERSION'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$CF_SMOKE_VERSION"
          fi
          export CF_SMOKE_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$CF_SMOKE_PASSWORD"
          docker run -d --name cineflow-smoke -p 127.0.0.1:16062:6060 \
            -e PUID=1000 -e PGID=1000 -e CF_SCHEDULER_ENABLED=false \
            -e CF_SUPERUSER="$CF_SMOKE_USERNAME" -e CF_SUPERUSER_PASSWORD="$CF_SMOKE_PASSWORD" cineflow:smoke
          export CF_SMOKE_URL="http://$(docker port cineflow-smoke 6060/tcp)"
          python scripts/container_smoke.py
          docker exec cineflow-smoke python -c "from pathlib import Path; assert Path('/proc/1/status').read_text().split('Uid:')[1].split()[0] == '1000'"
          first=$(docker exec cineflow-smoke sha256sum /app/data/jwt-secret.txt | cut -d ' ' -f 1)
          docker restart cineflow-smoke >/dev/null
          python scripts/container_smoke.py
          second=$(docker exec cineflow-smoke sha256sum /app/data/jwt-secret.txt | cut -d ' ' -f 1)
          test "$first" = "$second"

      - name: 容器失败日志
        if: failure()
        run: |
          docker port cineflow-smoke || true
          docker logs --tail 80 cineflow-smoke 2>&1 || true

      - name: 清理隔离容器
        if: always()
        run: docker rm -fv cineflow-smoke >/dev/null 2>&1 || true

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 自动注入，无需手工配置

      # 镜像名必须全小写，否则 GHCR 拒绝
      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cineflow
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 导出双架构离线镜像
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cineflow"
          version=$(python -c "import runpy; print(runpy.run_path('app/core/version.py')['APP_VERSION'])")
          export CF_SMOKE_VERSION="$version"
          export CF_SMOKE_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$CF_SMOKE_PASSWORD"
          trap 'docker rm -fv cineflow-package-smoke >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker buildx imagetools inspect "$image@$IMAGE_DIGEST"
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$image@$IMAGE_DIGEST"
            test "$(docker image inspect --format '{{.Architecture}}' "$image@$IMAGE_DIGEST")" = "$arch"
            archive_tag="$image:$version-$arch"
            docker tag "$image@$IMAGE_DIGEST" "$archive_tag"
            docker run -d --platform "linux/$arch" --name cineflow-package-smoke -p 127.0.0.1::6060 \
              -e PUID=1000 -e PGID=1000 -e CF_SCHEDULER_ENABLED=false \
              -e CF_SUPERUSER=smoke_admin -e CF_SUPERUSER_PASSWORD="$CF_SMOKE_PASSWORD" "$archive_tag"
            export CF_SMOKE_URL="http://$(docker port cineflow-package-smoke 6060/tcp)"
            python scripts/container_smoke.py
            docker rm -fv cineflow-package-smoke >/dev/null
            docker save "$archive_tag" | gzip -1 > "dist/cineflow-$version-linux-$arch.tar.gz"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          printf 'Image: `%s@%s`\n' "$image" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传离线 Docker 包
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-docker-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cineflow-docker-${{ github.sha }}
          path: dist
      - name: 发布版本与离线镜像附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cineflow"
            printf 'Docker image: `%s:%s`\n\n[变更与升级说明](https://github.com/%s/blob/%s/docs/08-变更日志.md)\n' \
              "$image" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "CineFlow $GITHUB_REF_NAME" \
              --generate-notes --notes-file release-notes.md dist/*
          fi
