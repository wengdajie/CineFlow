  #   image: lscr.io/linuxserver/jackett:latest
  #   container_name: jackett
  #   restart: unless-stopped
  #   ports:
  #     - "9117:9117"
  #   environment:
  #     PUID: 1000
  #     PGID: 1000
  #     TZ: Asia/Shanghai
  #   volumes:
  #     - ./jackett:/config

