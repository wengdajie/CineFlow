# ============================================================
# CineFlow —— 通用 docker compose 部署（群晖 / 威联通 / Linux / Windows）
#
#   飞牛 fnOS 用户请改用 docker-compose.fnos.yml（路径是 /vol1 不是 /volume1）
#
# 用法（无需下载源码，直接拉现成镜像）：
#   curl -O https://raw.githubusercontent.com/wengdajie/CineFlow/main/docker-compose.yml
#   # 改下面标注 ← 的几处，然后：
#   docker compose up -d
#   浏览器打开 http://<NAS_IP>:6060  默认账号 admin / cineflow（登录后立刻改密）
# ------------------------------------------------------------
# 重要：downloads 目录必须与下载器（qBittorrent 等）容器中的路径一致，
#       否则 CineFlow 找不到下载完成的文件，也无法使用硬链接。
#       library 与 downloads 建议放在同一个卷/文件系统上以启用硬链接。
# ============================================================
services:
  cineflow:
    # 官方预构建镜像（GitHub Actions 自动构建，支持 amd64 / arm64）
    # 想换版本：改这里的 tag，或设环境变量 CINEFLOW_IMAGE
    image: ${CINEFLOW_IMAGE:-ghcr.io/wengdajie/cineflow:latest}
    # ⚠️ 必须有 pull_policy：:latest 是**可变 tag**，docker compose up -d 默认
    # 只要本地存在同名镜像就直接复用，不会去检查远端有没有更新 —— 表现就是
    # 「明明 GitHub 已经是新版，容器里还是旧版本号」。always 让每次 up 都比对
    # digest（没更新时只有几十 KB 的 manifest 请求，不会重复下载层）。
    # 想锁定某个版本请把 tag 换成 sha-xxxxxxx 并把这里改成 missing。
    pull_policy: always
    # 想从源码自己编译？不要在这里加 build:，改用 override 文件（需先 git clone）：
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    container_name: cineflow
    restart: unless-stopped
    ports:
      - "6060:6060"
    environment:
      # 群晖/威联通请改为实际用户，避免文件权限问题（id 命令可查）
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      # 首次启动的管理员账号，登录后请立即改密
      CF_SUPERUSER: admin
      CF_SUPERUSER_PASSWORD: cineflow
      # 请替换为随机字符串
      CF_SECRET_KEY: please-change-this-to-a-random-string
      CF_TMDB_API_KEY: ""
      CF_TRANSFER_MODE: link
      CF_SUBSCRIBE_INTERVAL_MINUTES: 30
    volumes:
      - ./data:/app/data              # 数据库、日志（务必持久化）
      - ./config:/app/config          # config.yaml
      - ./plugins:/app/plugins        # 自定义插件
      - /volume1/downloads:/downloads # ← 改成你的下载目录
      - /volume1/media:/library       # ← 改成你的媒体库目录
      - ./strm:/strm
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6060/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------
  # 以下为可选配套服务，按需取消注释
  # ---------------------------------------------------------

  # BT 索引聚合器：把 PT/公开站点统一成 Torznab 接口供 CineFlow 调用
  # 启用后在 CineFlow「站点管理」新增 torznab 站点，
  # 地址填 http://jackett:9117/api/v2.0/indexers/<indexer>/results/torznab
  # jackett:
  #   image: lscr.io/linuxserver/jackett:latest
  #   container_name: jackett
  #   restart: unless-stopped
  #   ports:
  #     - "9117:9117"
  #   environment:
  #     PUID: 1000
  #     PGID: 1000
  #     TZ: Asia/Shanghai
  #   volumes:
  #     - ./jackett:/config

  # BT 下载器
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   container_name: qbittorrent
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #     - "6881:6881"
  #     - "6881:6881/udp"
  #   environment:
  #     PUID: 1000
  #     PGID: 1000
  #     TZ: Asia/Shanghai
  #     WEBUI_PORT: 8080
  #   volumes:
  #     - ./qbittorrent:/config
  #     - /volume1/downloads:/downloads   # ← 必须与 cineflow 的 downloads 完全一致

  # 网盘资源搜索（盘搜）：CineFlow 内置 pansou provider 直接对接
  # pansou:
