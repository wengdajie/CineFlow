<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0a0c11" />
  <title>CineFlow · 自动化观影追剧</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233e63dd'/%3E%3Cpath d='M8 9h16v14H8z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M13 9v14M19 9v14M8 16h16' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
  <!-- 主题需在样式生效前确定，避免刷新时闪白 -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("cf_theme") || "auto";
        var light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = mode === "light" || mode === "dark" ? mode : light ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-theme-mode", mode);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <!-- 无任何外部依赖，NAS 离线环境同样可用 -->
  <div id="app"></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
