<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>CineFlow 登录助手</title>
<style>
body{font:14px system-ui;width:310px;padding:16px;color:#222}h2{font-size:18px}label{display:block;margin:12px 0 6px}input,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}button{margin-top:12px;background:#5956d9;color:white;cursor:pointer}p{line-height:1.6;color:#555}#status{overflow-wrap:anywhere}
</style></head>
<body><h2>CineFlow 网盘登录助手</h2>
<p>只向你连接的 CineFlow 地址回传登录凭据。Cookie 不写入扩展存储。</p>
<label for="address">CineFlow 地址（包含端口）</label>
<input id="address" type="url" placeholder="http://192.168.1.10:6060" autocomplete="off">
<button id="connect">保存并连接</button>
<button id="retry" disabled>重新检测并回填</button><p id="status" role="status"></p>
<script src="popup.js"></script></body></html>
